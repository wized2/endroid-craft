<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87ceeb" />
      <stop offset="100%" stop-color="#5faad0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" />
  
  <!-- 3D Voxel Grass Block Group -->
  <g transform="translate(256, 260) scale(1.15)" filter="url(#shadow)">
    <!-- Top Face (Grass) -->
    <polygon points="0,-120 120,-50 0,20 -120,-50" fill="#5cb85c" />
    <polygon points="-80,-40 -40,-15 -20,-30 -60,-55" fill="#4ea54e" />
    <polygon points="40,-40 80,-15 60,-30 20,-55" fill="#6bc86b" />

    <!-- Left Face (Dirt + Grass overhang) -->
    <polygon points="-120,-50 0,20 0,140 -120,70" fill="#865c36" />
    <!-- Grass Overhang Left -->
    <polygon points="-120,-50 0,20 0,40 -20,30 -35,46 -50,28 -70,44 -85,26 -100,42 -120,30" fill="#4d9b4d" />
    <!-- Dirt Texture Accents Left -->
    <rect x="-85" y="65" width="22" height="18" fill="#6d4827" transform="skewY(30)" />
    <rect x="-40" y="85" width="20" height="20" fill="#9c6d42" transform="skewY(30)" />

    <!-- Right Face (Darker Dirt + Grass overhang) -->
    <polygon points="0,20 120,-50 120,70 0,140" fill="#6b4625" />
    <!-- Grass Overhang Right -->
    <polygon points="0,20 120,-50 120,-30 100,-20 85,-38 70,-22 50,-40 35,-24 20,-36 0,40" fill="#3d823d" />
    <!-- Dirt Texture Accents Right -->
    <rect x="25" y="80" width="22" height="18" fill="#55351a" transform="skewY(-30)" />
    <rect x="70" y="60" width="18" height="18" fill="#7d5430" transform="skewY(-30)" />
  </g>
</svg>
