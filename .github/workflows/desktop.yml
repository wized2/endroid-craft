name: Desktop build
on:
  push:
    branches: [desktop]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="desktop-v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/* --repo "${{ github.repository }}" --target desktop --title "Endroid Craft Desktop $TAG" --notes "Windows (installer + portable) and Linux AppImage builds."
